name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Extract Version
        id: get_version
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          VERSION=${RAW_TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$RAW_TAG" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Release APK and App Bundle
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Prepare and Validate Artifacts
        run: |
          mkdir -p release-artifacts
          
          # Find 64-bit ARM APK
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -o -name "*release-unsigned.apk" -o -name "*release.apk" | head -n 1)
          
          # Find Release AAB Bundle
          AAB_SRC=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: 64-bit Release APK was not generated!"
            exit 1
          fi
          
          if [ -z "$AAB_SRC" ] || [ ! -f "$AAB_SRC" ]; then
            echo "Error: Release AAB bundle was not generated!"
            exit 1
          fi
          
          APK_DEST="release-artifacts/FileFlow-v${VERSION}.apk"
          AAB_DEST="release-artifacts/FileFlow-v${VERSION}.aab"
          
          cp "$APK_SRC" "$APK_DEST"
          cp "$AAB_SRC" "$AAB_DEST"
          
          echo "APK_DEST=$APK_DEST" >> $GITHUB_ENV
          echo "AAB_DEST=$AAB_DEST" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FileFlow v${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APK_DEST }}
            ${{ env.AAB_DEST }}
