name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute Build Metadata
        id: meta
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          VERSION=${RAW_TAG#v}
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$RAW_TAG" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Run Tests
        run: gradle test -PAPP_VERSION_NAME=${{ env.VERSION }} -PAPP_VERSION_CODE=${{ env.COMMIT_COUNT }}

      - name: Build Release APK and App Bundle
        run: |
          gradle assembleRelease bundleRelease -PAPP_VERSION_NAME=${{ env.VERSION }} -PAPP_VERSION_CODE=${{ env.COMMIT_COUNT }}

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -o -name "*release-unsigned.apk" -o -name "*release.apk" | head -n 1)
          AAB_SRC=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: 64-bit Release APK was not generated!"
            exit 1
          fi
          
          if [ -z "$AAB_SRC" ] || [ ! -f "$AAB_SRC" ]; then
            echo "Error: Release AAB bundle was not generated!"
            exit 1
          fi
          
          APK_DEST="release-artifacts/FileFlow-v${VERSION}.apk"
          AAB_DEST="release-artifacts/FileFlow-v${VERSION}.aab"
          
          cp "$APK_SRC" "$APK_DEST"
          cp "$AAB_SRC" "$AAB_DEST"
          
          echo "APK_DEST=$APK_DEST" >> $GITHUB_ENV
          echo "AAB_DEST=$AAB_DEST" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FileFlow v${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APK_DEST }}
            ${{ env.AAB_DEST }}
